<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="B-cadastro">
    <main class="cadastro-container">

        <h1>GameZone</h1>

        <h2>Crie sua conta</h2>

        <form>

            <label for="username">Nome de usuário:</label>
            <input type="text" id="username" name="username" placeholder="Escolha um nome de usuário" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Crie uma senha" required>

            <label for="confirm-password">Confirmar senha:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita sua senha"
                required>

            <button type="submit">Criar conta</button>

        </form>

        <p>
            Já tem uma conta?
            <a href="index.html">Faça login</a>
        </p>

    </main>
</body>

</html>
