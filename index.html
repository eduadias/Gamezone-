<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone | Login</title>

    <style>
        .login-container form {
            width: 100%;
        }

        .login-container label {
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }

        .login-container input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #51416f;
            border-radius: 8px;
            background-color: #0e0b18;
            color: white;
            outline: none;
        }

        .login-container button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #7943d8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .login-container button:hover {
            background-color: #965fff;
        }

        .login-container h1 {
            text-align: center;
            font-size: 28px;
            margin-top: 0;
        }

        .login-container p {
            text-align: center;
        }

        .login-container a {
            color: #b48aff;
            text-decoration: none;
        }

        .login-container a:hover {
            color: #d6c2ff;
            text-decoration: underline;
        }
    </style>
</head>

<body style="
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
        rgba(9, 9, 20, 0.65),
        rgba(33, 16, 68, 0.75)
    ),
    url('img/imagem-fundo.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;
    color: white; font-family: Arial, sans-serif; ">


    <div class=" login-container" style="box-sizing: border-box;
    width: 420px;
    max-width:400px;
    padding: 40px;
    background: rgba(20, 15, 35, 0.95);
    border: 1px solid rgba(145, 90, 255, 0.5);
    border-radius: 18px;
    box-shadow: 0 0 35px rgba(255, 255, 255, 0.25);">

    <form style=" display: flex; flex-direction: column; gap: 12px; width: 100%; ">
        <h1>Bem-vindo ao GameZone</h1>

        <h2>Login</h2>

        <label for=" username">Nome de usuário:</label>
        <input type="text" id="username" name="username" placeholder="Digite seu nome de usuário" required>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

        <button type="submit">Entrar</button>
    </form>

    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

</body>

</html>
